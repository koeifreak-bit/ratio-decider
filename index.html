<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Blend simulator for roasted-bean resellers: exact ratios, predicted cup, SCA cupping and cafÃ© spec sheets.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Ratio Decider</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a cupping-lab workbench. Sticky header + tab rail; simulator = inputs column + results column, stacked on phones. */
:root {
  --bg: #f2f3ef; --surface: #ffffff; --surface-2: #eaece6; --ink: #1d1a17; --ink-2: #5d5851; --line: #d7d9d1;
  --accent: #7a3e1d; --accent-ink: #ffffff; --accent-soft: #f2e5db;
  --ok: #2c7548; --ok-soft: #e0efe5; --warn: #9a620a; --warn-soft: #f7ebd2; --bad: #ac3528; --bad-soft: #f6dfdb;
  --b1: #7a3e1d; --b2: #c4883a; --b3: #5a7a4c; --b4: #3a6883; --b5: #9a4d69;
  --band: rgba(122, 62, 29, .16);
  --font-display: 'Bitter', Georgia, 'Times New Roman', serif;
  --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141311; --surface: #1d1b18; --surface-2: #27241f; --ink: #efe9e2; --ink-2: #a9a198; --line: #38332d;
  --accent: #dc955f; --accent-ink: #1a120c; --accent-soft: #3a2a1e;
  --ok: #72c592; --ok-soft: #1b3226; --warn: #e5b25a; --warn-soft: #3a2d15; --bad: #f08a7c; --bad-soft: #3e211c;
  --b1: #dc955f; --b2: #e8c47c; --b3: #96ba82; --b4: #81b3d1; --b5: #d68ca7; --band: rgba(220, 149, 95, .2);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141311; --surface: #1d1b18; --surface-2: #27241f; --ink: #efe9e2; --ink-2: #a9a198; --line: #38332d;
  --accent: #dc955f; --accent-ink: #1a120c; --accent-soft: #3a2a1e;
  --ok: #72c592; --ok-soft: #1b3226; --warn: #e5b25a; --warn-soft: #3a2d15; --bad: #f08a7c; --bad-soft: #3e211c;
  --b1: #dc955f; --b2: #e8c47c; --b3: #96ba82; --b4: #81b3d1; --b5: #d68ca7; --band: rgba(220, 149, 95, .2);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.02rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; }

/* Header + tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.35rem; letter-spacing: -.01em; }
.brand h1 b { color: var(--accent); font-weight: 700; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 6px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 8px 12px 10px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: .9rem; border-bottom: 3px solid transparent; text-decoration: none; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-mono); font-size: .75rem; color: var(--ink-2); margin-left: 4px; }

main { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 64px; }
.banner { border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; font-size: .9rem; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); }

/* Building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.big { padding: 12px 20px; font-size: 1rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; color: var(--ink-2); font-weight: 600; }
input[type=text], input[type=number], input[type=search], select, textarea {
  width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { resize: vertical; min-height: 64px; }
input[type=number] { font-family: var(--font-mono); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 7px 12px; font-size: .88rem; font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg label:last-child span { border-right: 0; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .8rem; background: var(--surface-2); border: 1px solid transparent; }
.chip.unknown { background: none; border: 1px dashed var(--ink-2); color: var(--ink-2); cursor: pointer; }
.chip.defect { background: var(--bad-soft); color: var(--bad); }
.chip.ignored { background: none; color: var(--ink-2); text-decoration: line-through; }
.chip i { font-style: normal; font-family: var(--font-mono); font-size: .72rem; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-weight: 700; font-size: .8rem; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.fail { background: var(--bad-soft); color: var(--bad); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.list { display: grid; gap: 10px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; }
details > summary { cursor: pointer; font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 20; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.toast.bad { background: var(--bad); color: #fff; }

/* Simulator */
.sim { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .sim { grid-template-columns: minmax(0, 1fr); } }
.beanrow { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; border-left-width: 5px; }
.verdict { border-radius: var(--r); padding: 16px; display: grid; gap: 10px; border: 1px solid var(--line); background: var(--surface); }
.verdict.ok { border-top: 4px solid var(--ok); } .verdict.warn { border-top: 4px solid var(--warn); } .verdict.fail { border-top: 4px solid var(--bad); }
.ratio-big { font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -.01em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ratio-big .sep { color: var(--ink-2); font-weight: 500; padding: 0 .12em; }
.ratiobar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.ratiobar div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.adjust { display: grid; gap: 8px; }
.adjust .arow { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 10px; align-items: center; }
.adjust input[type=range] { width: 100%; accent-color: var(--accent); }
.meters { display: grid; gap: 8px; }
.meter { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: .88rem; }
.track { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; }
.track .band { position: absolute; top: -3px; bottom: -3px; background: var(--band); border: 1px solid var(--accent); border-radius: 4px; }
.track .mark { position: absolute; top: -5px; width: 4px; height: 20px; margin-left: -2px; background: var(--ink); border-radius: 2px; }
.track .ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; pointer-events: none; }
.track .ticks i { width: 1px; background: var(--line); }
.tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tier { display: grid; gap: 6px; align-content: start; }
.fam { display: grid; grid-template-columns: 128px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: .85rem; }
.fam .bar { height: 8px; border-radius: 4px; background: var(--accent); }
.reasons { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.alt { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.sample { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; }
.sample .code { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 600; letter-spacing: .08em; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.ai-out { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 12px; font-size: .92rem; }
.stale { font-size: .85rem; color: var(--warn); font-weight: 600; }
.origin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.origin:last-child { border-bottom: 0; }
.scorebar { display: inline-grid; grid-template-columns: repeat(4, auto); gap: 4px 10px; font-size: .78rem; color: var(--ink-2); }
.scorebar b { font-family: var(--font-mono); color: var(--ink); font-weight: 600; }
.badge { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); }
.badge.robusta { background: var(--accent-soft); color: var(--accent); }
.badge.liberica, .badge.excelsa { background: var(--warn-soft); color: var(--warn); }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .cmp { grid-template-columns: minmax(0, 1fr); } }
.delta-pos { color: var(--ok); } .delta-neg { color: var(--bad); }
.badge.proc { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
details.gate, details.consistency { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
details.gate[open] { border-color: var(--accent); }
details.gate > summary, details.consistency > summary { list-style-position: inside; }
.sheet h2 { font-size: 1.5rem; }
table.origins td { white-space: normal; vertical-align: top; }
table.origins td.origin-cell { min-width: 220px; }
.proc-cell { min-width: 132px; }
.proc-scores { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 10px; font-size: .78rem; color: var(--ink-2); justify-content: start; }
.proc-scores b { font-family: var(--font-mono); color: var(--ink); font-weight: 600; }
.proc-cell.est .proc-scores b { color: var(--ink-2); font-weight: 500; }
.proc-cell .small { color: var(--accent); font-weight: 600; }
.proc-cell.est .small { color: var(--ink-2); font-weight: 400; }
@media (prefers-reduced-motion: no-preference) { .verdict, .card { transition: border-color .2s; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>The <b>Ratio</b> Decider</h1>
      <span class="muted small">Blend simulator and cupping log for roasted-bean resellers</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main id="main" aria-live="polite">
  <div class="empty"><p>Loading the blend simulator…</p></div>
</main>

<script src="lexicon.js"></script>
<script src="origins.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>

</body>
</html>
